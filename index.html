<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр вопросов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one centred column (max 780px): sticky top bar → map / lesson / trainer. Colour = grammar role of a word. */
:root{
  --bg:#EDF0F6; --card:#FFFFFF; --ink:#172033; --muted:#5B6680; --line:#D6DCE8; --soft:#E5EAF3;
  --q:#7C3AED; --a:#1D5BD8; --s:#0E8452; --v:#C9580B; --o:#56617A;
  --ok:#0E7F52; --okbg:#E1F4EA; --warn:#9A5B00; --warnbg:#FFF1D6; --bad:#C2372F; --badbg:#FCE6E3;
  --accent:#1D5BD8; --accent-ink:#FFFFFF;
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E121A; --card:#171D29; --ink:#E6EAF3; --muted:#98A2B7; --line:#2A3346; --soft:#20283A;
  --q:#B691FF; --a:#73A0FF; --s:#45CC8E; --v:#FF9C55; --o:#A6AFC3;
  --ok:#4CD497; --okbg:#12301F; --warn:#FFC468; --warnbg:#36290F; --bad:#FF7C71; --badbg:#3A1916;
  --accent:#73A0FF; --accent-ink:#0E121A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E121A; --card:#171D29; --ink:#E6EAF3; --muted:#98A2B7; --line:#2A3346; --soft:#20283A;
  --q:#B691FF; --a:#73A0FF; --s:#45CC8E; --v:#FF9C55; --o:#A6AFC3;
  --ok:#4CD497; --okbg:#12301F; --warn:#FFC468; --warnbg:#36290F; --bad:#FF7C71; --badbg:#3A1916;
  --accent:#73A0FF; --accent-ink:#0E121A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.5rem,4vw,2.1rem)} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--f-display);font-weight:700;font-size:.95rem}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.05rem}
.top-stats{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stat{padding:4px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.icon-btn{background:var(--soft);border:0;border-radius:99px;padding:4px 10px;font-size:.85rem;color:var(--muted)}

.wrap{max-width:780px;margin:0 auto;padding-block:24px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.acc{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}

/* grammar tokens */
.tok{display:inline-block;font-family:var(--f-mono);font-weight:500;padding:2px 7px;border-radius:7px;white-space:nowrap}
.t-q{color:var(--q);background:color-mix(in srgb,var(--q) 13%,transparent)}
.t-a{color:var(--a);background:color-mix(in srgb,var(--a) 13%,transparent)}
.t-s{color:var(--s);background:color-mix(in srgb,var(--s) 13%,transparent)}
.t-v{color:var(--v);background:color-mix(in srgb,var(--v) 14%,transparent)}
.t-o,.t-t{color:var(--ink);background:var(--soft)}
.t-p{color:var(--muted);padding:2px 2px}
.tok.bad{color:var(--bad);background:var(--badbg);text-decoration:line-through}
.tok.mask{min-width:3.2em;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* map */
.hero{display:flex;flex-direction:column;gap:10px}
.hero p{max-width:60ch;color:var(--muted)}
.level{display:flex;flex-direction:column;gap:10px}
.level-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{display:flex;flex-direction:column;gap:10px;min-width:0}
.mod.locked{background:transparent;border-style:dashed}
.mod.locked .mod-title{color:var(--muted)}
.mod-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mod-num{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.mod-title{font-weight:700;font-size:1.02rem;line-height:1.3}
.mod-ex{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.resume{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-color:var(--accent)}

/* lesson */
.lesson-sec{display:flex;flex-direction:column;gap:14px}
.big-idea{font-size:1.25rem;font-weight:600;line-height:1.4;max-width:40ch}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.fslot{display:flex;flex-direction:column;align-items:center;gap:4px}
.fslot .tok{font-size:1.05rem;padding:6px 10px}
.fslot small{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.plus{align-self:center;color:var(--muted);font-family:var(--f-mono);padding-bottom:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:.875rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.demo-line{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:1.25rem;padding:14px;border-radius:12px;background:var(--soft)}
.demo-line .tok{font-size:1.15rem;padding:5px 10px}
.demo-cap{min-height:3em;max-width:62ch}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td code,.mono{font-family:var(--f-mono);font-size:.9em}
.errs{display:grid;gap:8px}
.err{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.err .no{font-family:var(--f-mono);color:var(--bad);text-decoration:line-through}
.err .yes{font-family:var(--f-mono);color:var(--ok);font-weight:700}
.err .why{grid-column:1/-1;font-size:.875rem;color:var(--muted)}
@media (max-width:520px){ .err{grid-template-columns:1fr} }
.mc{display:flex;flex-direction:column;gap:8px;padding-block:6px}
.mc+.mc{border-top:1px solid var(--line);padding-top:14px}

/* trainer */
.strip{display:flex;gap:2px}
.strip i{flex:1;height:7px;border-radius:2px;background:var(--soft)}
.strip i.f{background:var(--ok)} .strip i.h{background:var(--warn)} .strip i.s{background:var(--bad)}
.strip i.cur{background:var(--accent)}
.train-head{display:flex;flex-direction:column;gap:10px}
.task{display:flex;flex-direction:column;gap:18px}
.task-type{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.prompt-ru{font-size:1.5rem;font-weight:600;line-height:1.35}
.prompt-en{font-family:var(--f-mono);font-size:1.25rem;line-height:1.6;overflow-wrap:anywhere}
.prompt-en mark{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--ink);padding:1px 5px;border-radius:5px;border-bottom:2px solid var(--accent)}
.prompt-en .wrong{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent);font-weight:700}
.about{color:var(--muted)}
.inp{width:100%;font-family:var(--f-mono);font-size:1.1rem;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent)}
.inp:disabled{opacity:.75}
.chip-zone{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:12px;border:2px dashed var(--line);align-content:flex-start}
.chip-zone.filled{border-style:solid;border-color:var(--accent)}
.chip-bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-mono);font-size:1.05rem;padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);box-shadow:0 2px 0 var(--line)}
.chip:hover{border-color:var(--accent)}
.chip.ghost{visibility:hidden}
.chip-zone .chip{background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.zone-ph{color:var(--muted);font-size:.9rem;align-self:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.opt{font-family:var(--f-mono);font-size:1.1rem;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt kbd{font-family:var(--f-body);font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad);text-decoration:line-through}
.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fb.warn{background:var(--warnbg);color:var(--ink)}
.fb.warn .fb-head{color:var(--warn)}
.fb.ok{background:var(--okbg)}
.fb.ok .fb-head{color:var(--ok)}
.fb.shown{background:var(--badbg)}
.fb.shown .fb-head{color:var(--bad)}
.fb-head{font-weight:700}
.ans-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ans-line .tok{font-size:1.1rem;padding:4px 9px}
.say{border:0;background:var(--card);border-radius:99px;width:34px;height:34px;display:inline-grid;place-items:center;color:var(--accent);flex:none}
.say:hover{background:var(--soft)}
.say svg{width:16px;height:16px}
.alts{display:flex;flex-direction:column;gap:6px;padding-top:6px;border-top:1px solid color-mix(in srgb,var(--ok) 25%,transparent)}
.alt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alt .en{font-family:var(--f-mono);font-weight:500}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kbd-hint{font-size:.8rem;color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* results */
.score{display:flex;gap:12px;flex-wrap:wrap}
.score>div{flex:1;min-width:130px;padding:14px;border-radius:12px;background:var(--soft)}
.score b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.catrow{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 2.5em;gap:10px;align-items:center;font-size:.9rem}
.catrow .bar>i{background:var(--warn)}
.catrow span:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* rules: toc, lists, drawer */
[data-sec]{scroll-margin-top:84px}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:.82rem}
.toc button:hover{border-color:var(--accent);color:var(--accent)}
.lesson-sec p{max-width:66ch}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.ex{display:inline-flex;align-items:center;gap:4px}
.ex .say{width:28px;height:28px;background:transparent}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:var(--soft);min-width:0}
.col h3{font-family:var(--f-body);font-size:.95rem}
.pairs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:.92rem;align-items:center}
.pairs .mono{overflow-wrap:anywhere}
.note{padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--accent) 9%,transparent);font-size:.92rem}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-align:left;text-decoration:underline;text-underline-offset:3px}
.drawer{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end;background:rgba(10,14,22,.45)}
.drawer-panel{width:min(700px,100%);height:100%;overflow-y:auto;background:var(--bg);box-shadow:-10px 0 40px rgba(0,0,0,.25);animation:slidein .25s ease-out}
.drawer-head{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border-bottom:1px solid var(--line);
  padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.drawer-body{display:flex;flex-direction:column;gap:16px;padding-block:16px 48px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.drawer [data-sec]{scroll-margin-top:72px}
body.lock{overflow:hidden}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tip{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;background:var(--soft);border-top:3px solid var(--accent);min-width:0}
.tip h3{font-family:var(--f-body);font-size:1rem}
.tip p{font-size:.92rem}
.tip-mem{border-top-color:var(--q)} .tip-mem .pill{background:color-mix(in srgb,var(--q) 14%,transparent);color:var(--q)}
.tip-obs{border-top-color:var(--s)} .tip-obs .pill{background:color-mix(in srgb,var(--s) 14%,transparent);color:var(--s)}
.tip-hack{border-top-color:var(--v)} .tip-hack .pill{background:color-mix(in srgb,var(--v) 14%,transparent);color:var(--v)}
.tip .pill{align-self:flex-start}
@keyframes slidein{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}

@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
@media (max-width:520px){ .top-stats .stat.days{display:none} .prompt-ru{font-size:1.3rem} .card{padding:16px} }

/* standalone reset (the artifact viewer adds this itself) */
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="brand" data-act="home" aria-label="На карту модулей"><span class="brand-mark">?</span><span>Тренажёр вопросов</span></button>
  <div class="top-stats">
    <span class="stat days" id="top-days"></span>
    <span class="stat" id="top-xp"></span>
    <button class="icon-btn" id="snd" data-act="sound"></button>
  </div>
</div></header>
<main class="wrap" id="app"></main>
<div class="drawer" id="drawer" hidden><div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="drawer-head"><h2 id="drawer-title">Правило</h2><button class="btn primary" data-act="close-rule" id="drawer-close">Вернуться к заданию</button></div>
  <div class="drawer-body" id="drawer-body"></div>
</div></div>

<script>
/* ============ DATA ============ */
const LEVELS = {1:"Основа · A1–A2",2:"Специальные вопросы · A2",3:"Живая речь · B1",4:"Продвинутый · B1+ / B2"};
const MODULES = [
  {id:"m1",lvl:1,t:"Вопросы с to be",ex:"Are you ready? Where was he?"},
  {id:"m2",lvl:1,t:"Do / does: Present Simple",ex:"Does she work here? — Yes, she does."},
  {id:"m3",lvl:1,t:"Did: Past Simple",ex:"Did you call? What did you buy?"},
  {id:"m4",lvl:1,t:"Модальные: can, will, should…",ex:"Can I sit here? Should we wait?"},
  {id:"m5",lvl:2,t:"Вопросительные слова",ex:"Why did she leave? Whose bag is it?"},
  {id:"m6",lvl:2,t:"What time, how much, how often…",ex:"How often do you train?"},
  {id:"m7",lvl:2,t:"Continuous, Perfect, Future",ex:"Have you ever been…? What are you doing?"},
  {id:"m8",lvl:2,t:"Вопрос к подлежащему",ex:"Who called you? / Who did you call?"},
  {id:"m9",lvl:2,t:"Предлог в конце, What … like?",ex:"Who are you talking to? What's it like?"},
  {id:"m10",lvl:3,t:"Альтернативные вопросы",ex:"Tea or coffee? Did you walk or drive?"},
  {id:"m11",lvl:3,t:"Отрицательные вопросы",ex:"Don't you like it? Why didn't you come?"},
  {id:"m12",lvl:3,t:"Разделительные (tags)",ex:"You're new here, aren't you?"},
  {id:"m13",lvl:3,t:"Косвенные и вежливые",ex:"Could you tell me where the station is?"},
  {id:"m14",lvl:3,t:"Короткие реакции",ex:"I've been to Japan. — Have you?"},
  {id:"m15",lvl:4,t:"Пассив в вопросах",ex:"Where was it made? When will it be ready?"},
  {id:"m16",lvl:4,t:"Сложные случаи",ex:"How long have you been waiting?"}
];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function parseF(f){ return f.split("|").map(p=>{ const i=p.indexOf(":"); return {tag:p.slice(0,i),text:p.slice(i+1)}; }); }
function mainText(t){ return cap(parseF(t.f).map(s=>s.text).join(" "))+(t.end||"?"); }
function tokensHTML(t, cls=""){ return parseF(t.f).map((s,i)=>`<span class="tok t-${s.tag} ${cls}">${esc(i===0?cap(s.text):s.text)}</span>`).join(" ")+`<span class="tok t-p">${t.end||"?"}</span>`; }

const CONTR = [[/\bcan't\b/g,"can not"],[/\bcannot\b/g,"can not"],[/\bwon't\b/g,"will not"],[/\b(\w+)n't\b/g,"$1 not"],[/\bi'm\b/g,"i am"],[/'re\b/g," are"],[/'s\b/g," is"],[/'ve\b/g," have"],[/'ll\b/g," will"],[/'d\b/g," would"]];
function norm(s){ s=String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[?!.,;:"«»—–]/g," "); for(const [r,x] of CONTR) s=s.replace(r,x); return s.replace(/\s+/g," ").trim(); }
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
const BE=["am","is","are","was","were"], DO=["do","does","did"];
const AUXW=[...BE,...DO,"can","could","will","would","should","must","have","has","had","shall","may","might"];
const WH=["what","where","when","why","who","whom","whose","which","how"];
const PROTECT=new Set([...AUXW,"to",...WH,"a","an","the","there","not","i","you","he","she","it","we","they"]);

function accepted(t){
  const segs=parseF(t.f), list=[mainText(t)];
  if(segs.some(s=>s.tag==="t")) list.push(segs.filter(s=>s.tag!=="t").map(s=>s.text).join(" "));
  // "Don't you…?" is also right as "Do you not…?"
  const ai=segs.findIndex(s=>s.tag==="a");
  if(!t.end && ai>-1 && segs[ai+1] && segs[ai+1].tag==="s" && /n't$/i.test(segs[ai].text) && !(/^aren't$/i.test(segs[ai].text) && segs[ai+1].text==="I")){
    const a=segs[ai].text, full={"can't":"can","won't":"will","shan't":"shall"}[a.toLowerCase()]||a.replace(/n't$/i,"");
    list.push(segs.map((s,i)=>i===ai?full:(i===ai+1?s.text+" not":s.text)).join(" "));
  }
  return {list:list.concat(t.acc||[]), auto:list.length};
}
function match(t,raw){
  const u=norm(raw), A=accepted(t);
  for(let i=0;i<A.list.length;i++) if(norm(A.list[i])===u) return {ok:true,alt:i>=A.auto};
  const ut=u.split(" ");
  for(const a of A.list){ const at=norm(a).split(" "); if(at.length!==ut.length) continue;
    const diff=at.map((w,j)=>w!==ut[j]?j:-1).filter(j=>j>=0);
    if(diff.length===1){ const w=at[diff[0]], x=ut[diff[0]];
      const vw=norm(parseF(t.f).filter(s=>s.tag==="v").map(s=>s.text).join(" ")).split(" ");
      if(!PROTECT.has(w)&&!PROTECT.has(x)&&!inflected(w,x)&&!vw.includes(w)&&w.length>=4&&lev(w,x)<=(w.length>6?2:1)) return {ok:true,typo:{from:x,to:w}}; } }
  return {ok:false};
}
const IRREG={go:"went",see:"saw",buy:"bought",have:"had",do:"did",make:"made",take:"took",come:"came",get:"got",say:"said",eat:"ate",meet:"met",leave:"left",find:"found",know:"knew",tell:"told",think:"thought",give:"gave",sleep:"slept",write:"wrote",speak:"spoke",drink:"drank",begin:"began",break:"broke",lose:"lost",pay:"paid",send:"sent",spend:"spent",feel:"felt",hear:"heard",win:"won",sit:"sat",stand:"stood",understand:"understood",forget:"forgot",choose:"chose",catch:"caught",teach:"taught",bring:"brought",fly:"flew",drive:"drove",wake:"woke",run:"ran",swim:"swam",sing:"sang",become:"became",fall:"fell",grow:"grew",hold:"held",keep:"kept",wear:"wore",steal:"stole"};
function inflected(w,x){ const f=b=>[b+"s",b+"es",b+"d",b+"ed",b+"ing",b.replace(/y$/,"ies"),b.replace(/e$/,"ing")]; return f(w).includes(x)||f(x).includes(w); }
function tokLev(a,b){ return lev(a,b); }
function sameBag(a,b){ return a.length===b.length && [...a].sort().join(" ")===[...b].sort().join(" "); }

const MODAL=["can","could","will","would","should","must","may","might","shall"];
const HAVE=["have","has","had"];
function diagnose(t,raw){
  const u=norm(raw).split(" ").filter(Boolean);
  const exps=accepted(t).list.map(x=>norm(x).split(" "));
  const e=exps.reduce((b,x)=>tokLev(u,x)<tokLev(u,b)?x:b, exps[0]);
  const segs=parseF(t.f);
  const subj=(segs.find(s=>s.tag==="s")||{text:""}).text;
  const verb=(segs.find(s=>s.tag==="v")||{}).text;
  const auxSeg=segs.find(s=>s.tag==="a"), eAux=auxSeg?norm(auxSeg.text).split(" ")[0]:null;
  const hook=CONTENT[t.mid]&&CONTENT[t.mid].diagnose;
  if(hook){ const r=hook({t,u,e,segs,subj,verb,eAux}); if(r) return r; }
  const uDo=u.find(w=>DO.includes(w)), uBe=u.find(w=>BE.includes(w));
  const eDo=eAux?(DO.includes(eAux)?eAux:null):e.find(w=>DO.includes(w));
  const eBe=eAux?(BE.includes(eAux)?eAux:null):e.find(w=>BE.includes(w));
  const eMod=MODAL.includes(eAux)?eAux:null, eHave=HAVE.includes(eAux)?eAux:null;
  const uWh=u.find(w=>WH.includes(w)), eWh=e.find(w=>WH.includes(w));
  const aux=eAux||eDo||eBe;
  if(sameBag(u,e)) return {cat:"order",msg: aux ? `Все слова на месте, но порядок не тот. «${aux}» должен стоять перед подлежащим «${subj}».` : "Все слова на месте, но порядок не тот."};
  if(eMod && uDo && u.includes(eMod)) return {cat:"do_modal",msg:`С модальным глаголом ${eMod} помощник ${uDo} не нужен: ${eMod} сам встаёт перед подлежащим.`};
  if(eMod && !u.includes(eMod) && (uDo||u.some(w=>MODAL.includes(w)))) return {cat:"modal",msg:"Здесь нужен другой помощник — модальный глагол. Подумай о смысле: «можно / умеешь» → can, «стоит ли» → should, «будет» → will, «не хочешь ли» → would."};
  if(eMod && u.includes("to") && !e.includes("to")) return {cat:"modal_to",msg:`После ${eMod} глагол идёт без to.`};
  if(eDo && !uDo && uBe) return {cat:"be_verb",msg:`${verb?`«${verb}» — это`:"Здесь"} обычный глагол, а не состояние. С ним be не работает: нужен помощник ${eDo}.`};
  if(eBe && uDo && !e.includes(uDo)) return {cat:"do_be",msg:`С be помощник ${uDo} не нужен. Форма be сама встаёт перед подлежащим.`};
  if(eBe && uBe && !u.includes(eBe)){
    const past=["was","were"], eP=past.includes(eBe), uP=past.includes(uBe);
    let msg;
    if(eP!==uP) msg = eP ? "Это прошлое, нужна форма was или were." : "Это настоящее время, нужна форма am, is или are.";
    else if(norm(subj)==="there") msg = "После there форма be зависит от того, что идёт дальше: один предмет → is, несколько → are.";
    else msg = `Подлежащее «${subj}» требует другую форму. ${eP?"I / he / she / it → was; you / we / they → were.":"I → am; he / she / it → is; you / we / they → are."}`;
    return {cat:"be_form",msg};
  }
  if(eDo && uDo && uDo!==eDo && !e.includes(uDo)) return {cat:"do_form",msg: eDo==="did"||uDo==="did" ? "Проверь время: прошлое → did, настоящее → do / does." : `Подлежащее «${subj}» требует ${eDo}. he / she / it и одно существительное → does; I / you / we / they и несколько → do.`};
  if(eHave && !u.includes(eHave) && u.some(w=>HAVE.includes(w))) return {cat:"be_form",msg:`Подлежащее «${subj}» требует ${eHave}. he / she / it → has; I / you / we / they → have.`};
  const helper = eDo&&uDo ? eDo : (eMod&&u.includes(eMod) ? eMod : null);
  if(helper && verb){
    const vt=norm(verb).split(" ")[0];
    const forms=[vt+"s",vt+"es",vt.replace(/y$/,"ies"),{have:"has",do:"does",go:"goes"}[vt],vt+"ed",vt+"d",vt.replace(/y$/,"ied"),IRREG[vt],vt+"ing",vt.replace(/e$/,"ing")].filter(Boolean);
    const bad=u.find(w=>forms.includes(w) && ((w!=="does"&&w!=="did") || u.filter(x=>x===w).length>1));
    if(bad && !u.includes(vt) && helper==="did") return {cat:"verb_past",msg:`После did глагол стоит в начальной форме: ${bad} → ${vt}. Прошлое уже показал did — второй раз его показывать не нужно.`};
    if(bad && !u.includes(vt)) return {cat:"verb_s",msg:`После ${helper} глагол стоит в начальной форме: ${bad} → ${vt}.${helper==="does"?" Окончание -s уже «забрал» помощник does.":""}`};
  }
  if(aux && !u.some(w=>AUXW.includes(w))) return {cat:"aux_missing",msg:
      eDo==="did" ? `Не хватает помощника перед подлежащим. Глагол${verb?` «${verb}»`:""} сам вперёд не прыгает. Какой помощник показывает прошлое?`
    : eDo ? `Не хватает помощника перед подлежащим. У глагола${verb?` «${verb}»`:""} нет своей «прыгающей» формы, поэтому нужен do или does. Какой — зависит от подлежащего «${subj}».`
    : eMod ? "Не хватает модального глагола перед подлежащим (can, should, will, would…)."
    : eHave ? "Не хватает помощника have / has перед подлежащим."
    : "Не хватает помощника перед подлежащим. Без него получается утверждение со знаком вопроса. Какая форма be нужна для «"+subj+"»?"};
  if(aux && u.includes(aux)){ const sFirst=norm(subj).split(" ")[0]; const iS=u.indexOf(sFirst), iA=u.indexOf(aux);
    if(sFirst && iS>=0 && iS<iA) return {cat:"order",msg:`«${aux}» стоит после подлежащего. В вопросе он идёт перед ним.`}; }
  if(eWh && !uWh) return {cat:"wh",msg:"Не хватает вопросительного слова (what, where, why, how…)."};
  if(!eWh && uWh && !e.includes(uWh)) return {cat:"wh",msg:"Здесь нужен вопрос «да / нет», без вопросительного слова. Начни сразу с помощника."};
  if(eWh && uWh && uWh!==eWh) return {cat:"wh",msg:`«${uWh}» здесь не подходит. Подумай, о чём именно вопрос.`};
  if(e.some(w=>w==="a"||w==="an") && !u.some(w=>w==="a"||w==="an")) return {cat:"article",msg:"Не хватает артикля a / an. Перед профессией и предметом в единственном числе он обязателен."};
  const miss=e.filter(w=>!u.includes(w)).length, extra=u.filter(w=>!e.includes(w)).length;
  if(u.length===e.length){ const dj=e.map((w,j)=>w!==u[j]?j:-1).filter(j=>j>=0); if(dj.length===1) return {cat:"other",msg:`Почти! Одно слово не то: проверь «${u[dj[0]]}».`}; }
  if(miss===1 && extra===1) return {cat:"other",msg:`Почти! Одно слово не то: проверь «${u.find(w=>!e.includes(w))}».`};
  if(miss && !extra) return {cat:"other",msg:`Почти! Не хватает ${miss===1?"одного слова":"нескольких слов"}.`};
  if(extra && !miss) return {cat:"other",msg:`Есть ${extra===1?"лишнее слово":"лишние слова"}.`};
  return {cat:"other",msg:t.hint};
}

      <div class="row"><button class="btn primary" data-act="train" data-id="exam" data-mode="exam">${S.examBest!=null?"Сдать ещё раз":"Начать экзамен"}</button></div></section>`;
}

/* ---- lesson ---- */
function slot(tag,text,label){ return `<div class="fslot"><span class="tok t-${tag}">${text}</span><small>${label}</small></div>`; }
const PLUS=`<span class="plus">+</span>`;
const ex = en => `<span class="ex"><span class="mono">${esc(en)}</span>${sayBtn(en)}</span>`;
function grp(parts){ const txt=parts.map(p=>p[1]).join(" ").replace(/ ([?.])$/,"$1");
  return `<div class="ans-line">${parts.map(([tag,w])=>`<span class="tok t-${tag}">${esc(w)}</span>`).join(" ")}${sayBtn(txt)}</div>`; }
function rows(head,list){ return `<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${list.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
const tA = w => `<span class="tok t-a">${w}</span>`;

function m1Rules(){
  const errs=[["You are tired?","Are you tired?","Так говорят только с удивлением («Ты устал?!»). Обычный вопрос — через прыжок be."],
    ["Do you are ready?","Are you ready?","С be помощник do не нужен."],
    ["Where you are?","Where are you?","После вопросительного слова сразу идёт be."],
    ["Are you agree?","Do you agree?","agree, like, want, know — глаголы. Им нужен do, а не be."],
    ["Is he student?","Is he a student?","Перед профессией нужен артикль a / an."],
    ["Where was you?","Where were you?","you всегда с were."],
    ["Is there many people?","Are there many people?","Много людей → are."],
    ["Yes, I'm.","Yes, I am.","В кратком ответе «да» be не сокращают."],

    ["How many years are you?","How old are you?","Возраст — только через How old."],
    ["Is your flat is big?","Is your flat big?","Be один: он переехал вперёд, на старом месте его больше нет."],
    ["Where did you born?","Where were you born?","«Родиться» — be born, поэтому was / were, а не did."],
    ["Did you tire?","Are you tired?","«Устал» по-русски прошлое, но по-английски это состояние: be tired."],
    ["Are you boring? (= тебе скучно?)","Are you bored?","Boring — «скучный, занудный». Что чувствуешь ты — bored."],
    ["Is it cold for you?","Are you cold?","«Мне холодно» → «я холодный»: человек становится подлежащим."],
    ["How do you feel yourself?","How do you feel?","После feel не нужен yourself."]];
  return [
  {id:"why",title:"Почему это трудно",body:`
    <p>В русском вопрос отличается от утверждения только интонацией: «Ты готов.» → «Ты готов?». Слова остаются на своих местах.</p>
    <p>В английском так не работает: чтобы получился вопрос, слова <b>меняются местами</b>. Фраза <span class="mono">You are ready?</span> прозвучит как удивлённый переспрос («Ты что, уже готов?!»), а не как обычный вопрос.</p>
    <p>Хорошая новость: с глаголом be перестановка самая простая — переезжает всего одно слово. Поэтому с него и начинаем.</p>`},
  {id:"formula",title:"Формула и порядок действий",body:`
    <p class="muted">Вопрос «да / нет» (общий)</p>
    <div class="formula">${slot("a","Am / Is / Are","be")}${PLUS}${slot("s","you","подлежащее")}${PLUS}${slot("o","ready","остальное")}<span class="plus">?</span></div>
    <p class="muted">Вопрос с вопросительным словом (специальный)</p>
    <div class="formula">${slot("q","Where","вопрос. слово")}${PLUS}${slot("a","was / were","be")}${PLUS}${slot("s","they","подлежащее")}${PLUS}${slot("o","…","остальное")}<span class="plus">?</span></div>
    <ol class="steps">
      <li>Составь утверждение: <span class="mono">She <b>is</b> at home.</span></li>
      <li>Найди форму be и переставь её <b>перед подлежащим</b>: <span class="mono"><b>Is</b> she at home?</span></li>
      <li>Нужно спросить «где? когда? почему?» — поставь вопросительное слово в самое начало, а ту часть, о которой спрашиваешь, убери: <span class="mono"><b>Where</b> is she?</span></li>
      <li>В конце знак вопроса. Помощник do не нужен — be справляется сам.</li></ol>`},
  {id:"forms",title:"Какую форму be выбрать",body:`
    ${rows(["Подлежащее","Сейчас","В прошлом","Пример"],[
      ["I",tA("am"),tA("was"),ex("Am I late?")+" "+ex("Was I right?")],
      ["he / she / it, одно имя, один предмет",tA("is"),tA("was"),ex("Is she here?")+" "+ex("Was it good?")],
      ["you / we / they, несколько предметов",tA("are"),tA("were"),ex("Are you ready?")+" "+ex("Were they there?")]])}
    <div class="note"><b>you</b> — всегда are / were, даже если это один человек. «You was» — самая частая ошибка.</div>
    <p>Прошлое (was / were) выбираем, когда в вопросе есть маркеры: <span class="mono">yesterday, last night, last week, two days ago, in 2019, when you were a child</span>.</p>
    <p>Подлежащее с <b>and</b> — это несколько человек: <span class="mono">Are Tom and Kate at work?</span> Названия, имена и «это» — как he / she / it: <span class="mono">Is London expensive? Is this your bag?</span></p>`},
  {id:"when",title:"Когда в вопросе нужен be",body:`
    <p>Главное правило: <b>если в предложении нет глагола-действия</b> (work, like, go, eat…), значит, его роль играет be.</p>
    ${rows(["Что спрашиваем","Пример"],[
      ["Возраст",ex("How old are you?")],["Профессия",ex("Is she a doctor?")],["Место",ex("Where is the station?")],
      ["Откуда человек",ex("Where are you from?")],["Состояние, чувства",ex("Are you tired?")+" "+ex("Is he angry?")],
      ["Качество, оценка",ex("Is it expensive?")+" "+ex("Was the film good?")],["Погода",ex("Is it cold today?")],
      ["Цена",ex("How much is it?")],["Время, дата",ex("What time is it?")+" "+ex("When is your birthday?")],
      ["Рождение",ex("Where were you born?")]])}`},
  {id:"traps",title:"Ловушки перевода",body:`
    <p>Главный источник ошибок: в русском и английском слова разных частей речи. Где у нас глагол, у них может быть be + прилагательное, и наоборот.</p>
    <div class="cols">
      <div class="col"><h3>По-русски глагол → по-английски be</h3><div class="pairs">
        <span>бояться</span>${ex("Are you afraid of dogs?")}<span>опаздывать</span>${ex("Why are you late?")}
        <span>хотеть есть</span>${ex("Are you hungry?")}<span>интересоваться</span>${ex("Are you interested in art?")}
        <span>быть уверенным</span>${ex("Are you sure?")}<span>быть правым</span>${ex("Am I right?")}
        <span>мёрзнуть</span>${ex("Are you cold?")}<span>родиться</span>${ex("When were you born?")}
        <span>отсутствовать</span>${ex("Is he away?")}</div></div>
      <div class="col"><h3>Похоже на состояние, но это глагол → do</h3><div class="pairs">
        <span>соглашаться</span>${ex("Do you agree?")}<span>нравиться</span>${ex("Do you like it?")}
        <span>знать</span>${ex("Do you know him?")}<span>хотеть</span>${ex("Do you want tea?")}
        <span>нуждаться</span>${ex("Do you need help?")}<span>понимать</span>${ex("Do you understand?")}
        <span>верить</span>${ex("Do you believe me?")}<span>значить</span>${ex("What does it mean?")}</div></div>
    </div>
    <div class="note">Проверка: можно ли сказать «он <i>является</i> …ым» или «он <i>находится</i> …»? Тогда be. Если слово отвечает на «что делает?» — это глагол, и ему нужен do (модуль 2).</div>`},
  {id:"shortadj",title:"«Согласен», «нужен», «должен» — в английском это глаголы",body:`
    <p>«Ты <b>согласен</b>?» — по-русски это <b>краткое прилагательное</b>, как «готов», «рад», «уверен». Оно описывает состояние, а связка «есть» в настоящем времени просто пропадает: «Ты (есть) согласен?». Поэтому рука тянется перевести так же, как «Ты готов?» → ${strike("Are you agree?")}</p>
    <p>Но в английском для «согласен» <b>нет прилагательного</b>. Есть только глагол <b>agree</b> — «соглашаться». Русский описывает это как состояние («я согласен»), английский — как действие («я соглашаюсь»). А глаголу нужен помощник do, а не be.</p>
    ${rows(["","Готов — прилагательное","Согласен — в английском глагол"],[
      ["Утверждение",mn("I <b>am</b> ready."),mn("I <b>agree</b>.")],
      ["Вопрос",ex("Are you ready?"),ex("Do you agree?")],
      ["Отрицание",mn("I'm not ready."),mn("I <b>don't</b> agree. / I disagree.")],
      ["Прошлое",ex("Were you ready?"),ex("Did you agree?")],
      ["Краткий ответ",mn("Yes, I am."),mn("Yes, I do.")]])}
    <p>Та же ловушка с другими краткими прилагательными:</p>
    ${rows(["По-русски","По-английски","Вопрос"],[
      ["согласен","agree (глагол)",ex("Do you agree?")],
      ["нужен, нужна","need (глагол): «мне нужна» = «я нуждаюсь»",ex("Do you need help?")],
      ["должен (денег)","owe (глагол)",ex("How much do I owe you?")],
      ["должен (обязан)","have to: тоже обычный глагол",ex("Do you have to work today?")]])}
    <p>А вот эти краткие прилагательные в английском — тоже прилагательные, с ними be: <span class="mono">готов → Are you ready? уверен → Are you sure? рад → Are you glad? женат → Are you married?</span></p>
    <div class="note"><b>Проверка через to.</b> Подставь to перед английским словом. Звучит как глагол (<span class="mono">to agree, to need, to owe</span>) — значит, вопрос с do. Не звучит (<span class="mono">to ready, to sure</span> — бессмыслица) — значит, это прилагательное, и вопрос с be.</div>
    <p><b>Проверка ответом.</b> На <span class="mono">Do you agree?</span> отвечают <span class="mono">Yes, I do</span>. Если хочется ответить <span class="mono">Yes, I am</span> — значит, нужен be.</p>
    <p>Полезные фразы с agree:</p>
    ${rows(["Фраза","Значение"],[
      [ex("I disagree."),"Я не согласен. Звучит естественнее, чем I don't agree."],
      [ex("Agreed?"),"Договорились? В ответ — Agreed! Это готовая фраза, а не исключение из правила."],
      [ex("Do you agree with me?"),"agree <b>with</b> — с человеком или его мнением."],
      [ex("Did they agree to the plan?"),"agree <b>to</b> — на предложение, план, условия."],
      [ex("Are you OK with that?"),"Тебя это устраивает? — разговорный вариант через be."]])}`},
  {id:"trapwords",title:"Словарь ловушек: be или do?",body:`
    <p>Самые частые слова, на которых русскоговорящие путают be и do. Их четыре группы — пробеги глазами и запомни «странные» пары.</p>
    <h3>1. По-русски состояние — по-английски глагол → do</h3>
    ${rows(["По-русски","По-английски","Вопрос"],[
      ["Ты согласен?","agree",ex("Do you agree?")],
      ["Тебе нужна помощь?","need",ex("Do you need help?")],
      ["Сколько я тебе должен?","owe",ex("How much do I owe you?")],
      ["Ты должен (обязан) идти?","have to",ex("Do you have to go?")],
      ["Вы знакомы?","know each other",ex("Do you know each other?")],
      ["Ты похож на маму?","look like / take after",ex("Do you look like your mum?")],
      ["Ты не против?","mind",ex("Do you mind?")],
      ["Ты в курсе?","know",ex("Do you know about it?")],
      ["Тебе нравится?","like",ex("Do you like it?")],
      ["Тебе хочется погулять?","feel like + -ing",ex("Do you feel like going for a walk?")]])}
    <h3>2. По-русски глагол — по-английски прилагательное → be</h3>
    <p>Особенно коварны глаголы в прошедшем времени: «устал», «опоздал». По-русски это прошлое, а по-английски — состояние сейчас.</p>
    ${rows(["По-русски","По-английски","Вопрос"],[
      ["Ты устал?","tired",ex("Are you tired?")+" — не "+strike("Did you tire?")],
      ["Ты опоздал? / опаздываешь?","late",ex("Are you late?")],
      ["Ты проголодался?","hungry",ex("Are you hungry?")],
      ["Ты замёрз?","cold",ex("Are you cold?")],
      ["Ты заблудился?","lost",ex("Are you lost?")],
      ["Ты боишься? / испугался?","afraid / scared",ex("Are you scared?")],
      ["Ты злишься?","angry",ex("Are you angry?")],
      ["Ты обиделся?","upset / offended",ex("Are you upset?")],
      ["Ты волнуешься?","worried / nervous",ex("Are you nervous?")],
      ["Ты заболел?","ill / sick",ex("Are you ill?")],
      ["Ты удивился?","surprised",ex("Were you surprised?")],
      ["Ты интересуешься искусством?","interested in",ex("Are you interested in art?")],
      ["Ты влюбился?","in love",ex("Are you in love?")],
      ["Где ты родился?","born",ex("Where were you born?")]])}
    <h3>3. «Мне холодно» → «Я холодный»: человек становится подлежащим</h3>
    <p>Русские безличные фразы с «мне / тебе» в английском строятся от человека: не «тебе холодно», а «ты холодный» — <span class="mono">Are you cold?</span></p>
    ${rows(["По-русски","Вопрос","Не так"],[
      ["Тебе холодно?",ex("Are you cold?"),strike("Is it cold for you?")],
      ["Тебе жарко?",ex("Are you hot?"),strike("Is it hot to you?")],
      ["Тебе скучно?",ex("Are you bored?"),strike("Is it boring to you?")],
      ["Тебе страшно?",ex("Are you scared?"),strike("Is it scary for you?")],
      ["Тебе стыдно?",ex("Are you ashamed?"),strike("Is it shameful?")],
      ["Тебе больно?",ex("Does it hurt?")+" "+ex("Are you hurt?"),strike("Is it painful to you?")],
      ["Тебе нужно / надо?",ex("Do you need to…?")+" "+ex("Do you have to…?"),strike("Is it needed to you?")],
      ["Мне можно?",ex("Can I…?"),strike("Is it possible to me?")],
      ["Как ты себя чувствуешь?",ex("How do you feel?"),strike("How do you feel yourself?")]])}
    <h3>4. bored или boring: -ed и -ing</h3>
    <p>Прилагательное на <b>-ed</b> — что чувствуешь ты. На <b>-ing</b> — какой ты (или вещь) для других. Перепутаешь — и получится обидно.</p>
    ${rows(["Хочешь спросить","Правильно","Ловушка"],[
      ["Тебе скучно?",ex("Are you bored?"),mn("Are you boring? — «Ты зануда?»")],
      ["Тебе интересно?",ex("Are you interested?"),mn("Are you interesting? — «Ты интересный человек?»")],
      ["Ты устал?",ex("Are you tired?"),mn("Are you tiring? — «Ты утомительный?»")],
      ["Ты в восторге?",ex("Are you excited?"),mn("Are you exciting? — «Ты захватывающий?»")],
      ["Ты запутался?",ex("Are you confused?"),mn("Are you confusing? — «Ты сбиваешь с толку?»")],
      ["Тебе неловко?",ex("Are you embarrassed?"),mn("Are you embarrassing? — «Ты позоришь?»")]])}
    <div class="note">Правило одно для всех групп: смотри не на русское слово, а на <b>английское</b>. Глагол (agree, need, like, mind) → do. Прилагательное (tired, cold, bored, afraid) → be.</div>`},
  {id:"wh",title:"Вопросительные слова с be",body:`
    ${rows(["Слово","Значение","Пример"],[
      ["What","что, какой",ex("What is your name?")],["Where","где; откуда (+ from)",ex("Where are my keys?")],
      ["When","когда",ex("When is the meeting?")],["Why","почему",ex("Why are you sad?")],
      ["Who","кто",ex("Who is that girl?")],["Whose","чей",ex("Whose phone is this?")],
      ["Which","который (из нескольких)",ex("Which bag is yours?")],["How","как",ex("How was the trip?")],
      ["How old","сколько лет",ex("How old is he?")],["How much / many","сколько",ex("How much is it?")+" "+ex("How many people are there?")],
      ["What … like","какой (описание)",ex("What is your boss like?")],["What time","во сколько, который час",ex("What time is it?")]])}
    <p>Если вопросительное слово «склеено» с существительным, они идут вместе: <span class="mono">Whose phone is this? Which bag is yours? How many people are there?</span></p>`},
  {id:"long",title:"Длинное подлежащее",body:`
    <p>Подлежащее бывает длинным, из нескольких слов. Be всё равно встаёт <b>перед всей группой</b> — разрывать её нельзя.</p>
    ${grp([["a","Is"],["s","your new flat"],["o","near the station"],["p","?"]])}
    ${grp([["a","Are"],["s","the people in your office"],["o","friendly"],["p","?"]])}
    ${grp([["a","Was"],["s","the film you saw yesterday"],["o","good"],["p","?"]])}
    ${grp([["q","Where"],["a","is"],["s","the nearest bus stop"],["p","?"]])}
    <div class="note">Не оставляй второй be на старом месте: <span class="mono" style="color:var(--bad);text-decoration:line-through">Is your new flat is near the station?</span></div>`},
  {id:"there",title:"Есть ли…? There is / there are",body:`
    <p>Оборот <b>there is / there are</b> значит «есть, находится, имеется». В вопросе is / are тоже прыгает вперёд — перед there.</p>
    ${rows(["Что спрашиваем","Вопрос","Ответы"],[
      ["Один предмет",ex("Is there a bank near here?"),`<span class="mono">Yes, there is. / No, there isn't.</span>`],
      ["Несколько",ex("Are there any shops?"),`<span class="mono">Yes, there are. / No, there aren't.</span>`],
      ["В прошлом",ex("Was there a problem?")+" "+ex("Were there many people?"),`<span class="mono">Yes, there was. / No, there weren't.</span>`],
      ["Сколько",ex("How many rooms are there?")+" "+ex("How much milk is there?"),`<span class="mono">There are three.</span>`]])}
    <p>В вопросах вместо <b>some</b> обычно <b>any</b>: <span class="mono">Are there any questions?</span></p>
    <div class="note">Не путай: <span class="mono">Is there a bank?</span> — есть ли он вообще. <span class="mono">Where is the bank?</span> — где тот банк, о котором мы знаем.</div>`},
  {id:"short",title:"Краткие ответы",body:`
    <p>На вопрос «да / нет» англичане редко отвечают одним Yes или No — это звучит сухо. Обычно повторяют подлежащее и форму be.</p>
    ${rows(["Вопрос","Да","Нет"],[
      [ex("Are you ready?"),"<span class='mono'>Yes, I am.</span>","<span class='mono'>No, I'm not.</span>"],
      [ex("Is your sister at home?"),"<span class='mono'>Yes, she is.</span>","<span class='mono'>No, she isn't.</span>"],
      [ex("Were they late?"),"<span class='mono'>Yes, they were.</span>","<span class='mono'>No, they weren't.</span>"],
      [ex("Was I right?"),"<span class='mono'>Yes, you were.</span>","<span class='mono'>No, you weren't.</span>"]])}
    <ul class="steps"><li>Подлежащее меняется: спросили про <b>you</b> — отвечаешь про <b>I</b> (и форма меняется: were → was).</li>
      <li>Имя заменяется местоимением: <span class="mono">Is Anna…? → Yes, she is.</span></li>
      <li>«Да» не сокращаем: <span class="mono">Yes, I am</span>, а не <span class="mono">Yes, I'm</span>. «Нет» можно сокращать.</li></ul>`},
  {id:"sound",title:"Интонация и сокращения",body:`
    <p><b>Вопрос «да / нет»</b> — голос идёт вверх в конце ↗: ${ex("Are you ready?")}</p>
    <p><b>Вопрос с вопросительным словом</b> — голос идёт вниз ↘: ${ex("Where are you?")}</p>
    <p>В разговоре is после вопросительного слова почти всегда сокращают: <span class="mono">What's, Where's, Who's, How's, When's</span>. ${ex("Where's my phone?")}</p>

    <p>В модуле 1 вперёд прыгал be. Но в большинстве предложений be нет: <span class="mono">I <b>work</b>. She <b>likes</b> tea. They <b>live</b> here.</span> Обычные глаголы прыгать вперёд <b>не умеют</b>.</p>
    <p>Поэтому английский зовёт помощника — <b>do</b> (или <b>does</b>). Он встаёт перед подлежащим и показывает: «внимание, это вопрос». Сам по себе он ничего не значит и не переводится.</p>
    <p>Самая частая ошибка — забыть помощника: <span class="mono">You like coffee?</span> Носитель поймёт, но услышит удивление («Ты что, любишь кофе?!»), а не обычный вопрос.</p>`},

    <div class="note"><b>Одна s на вопрос.</b> В утверждении -s у глагола: <span class="mono">She work<b>s</b></span>. В вопросе она переезжает в помощника: <span class="mono">Doe<b>s</b> she work?</span> У глагола её больше нет.</div>

  {id:"when",title:"Когда используется Present Simple",body:`

    </div>
    <div class="note">Do и be в одном простом вопросе не встречаются. Ни <span class="mono">Do you are…</span>, ни <span class="mono">Are you like…</span>.</div>
    <p>Самые коварные пары собраны в <b>«Словаре ловушек»</b> урока модуля 1: «согласен → agree», «устал → tired», «мне холодно → I'm cold», «bored или boring». <button class="linkbtn" data-act="lesson" data-id="m1">Открыть урок модуля 1 →</button></p>`},
  {id:"have",title:"Have: «у тебя есть…?»",body:`

    <ul class="steps"><li><span class="mono">Yes, I like</span> и <span class="mono">Yes, I know</span> в кратком ответе — ошибка. Только <span class="mono">Yes, I do</span>.</li>

  {id:"tips",title:"Лайфхаки и запоминалки",body:`<div class="tips">${[

/* ---- trainer ---- */
function examIds(){
  const ids=[];
  for(const m of MODULES){ const C=CONTENT[m.id]; if(C) ids.push(...shuffle(C.tasks.map(t=>t.id)).slice(0,3)); }
  const rest=shuffle(Object.keys(TASKS).filter(id=>!ids.includes(id)));
  while(ids.length<50 && rest.length) ids.push(rest.pop());
  return shuffle(ids).slice(0,50);
}
function startTrain(mid,mode){
  const C=CONTENT[mid]; if(!C && mid!=="exam") return;
  let s=S.sess;
  if(!(s && s.mid===mid && s.mode===mode && s.i<s.ids.length)){
    const ids = mid==="exam" ? examIds() : mode==="mistakes" ? [...(S.bank[mid]||[])] : C.tasks.map(t=>t.id);
    if(!ids.length) return;
    s=S.sess={mid,mode,ids,i:0,res:{},cats:{},xp:0};
  }
  save(); go("train");
}
function viewTrain(){
  const s=S.sess, t0=TASKS[s.ids[s.i]];
  return `<section class="train-head"><div class="row"><div><div class="eyebrow">${s.mode==="mistakes"?"Работа над ошибками":s.mode==="exam"?"Экзамен · задание из модуля "+(MODULES.findIndex(x=>x.id===(t0||{}).mid)+1):"Тренажёр"}</div><h2 style="margin-top:2px">${esc(modTitle(s.mid))}</h2></div><span class="spacer"></span>
    <button class="btn" data-act="rule">К правилу</button><span class="pill acc" id="counter"></span></div><div class="strip" id="strip" aria-hidden="true"></div></section>
    <section class="card task" id="card"></section>
    <p class="kbd-hint">Enter — проверить / дальше. В заданиях с выбором — клавиши 1–4.</p>`;
}
function updateStrip(){
  const s=S.sess; if(!s) return;
  $("#strip").innerHTML=s.ids.map((id,i)=>{ const r=s.res[id]; return `<i class="${r==="first"?"f":r==="hint"?"h":r==="shown"?"s":i===s.i?"cur":""}"></i>`; }).join("");
  $("#counter").textContent=`${Math.min(s.i+1,s.ids.length)} / ${s.ids.length}`;
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function mountTask(){
  const s=S.sess, t=TASKS[s.ids[s.i]];
  T={t,order:t.opts?shuffle(t.opts.map((_,j)=>j)):[],attempts:0,stage:0,hinted:false,done:false,result:null,wrongOpts:[],picked:[],chips:[],msg:null,firstCat:null,typo:null,alt:false};
  if(t.type==="build"){
    const words=parseF(t.f).map(x=>x.text).join(" ").split(" ").map(w=>w==="I"?w:w.toLowerCase());
    T.chips=shuffle(words.concat(t.extra||[]));
  }
  const card=$("#card");
  let prompt="";
  if(t.type==="build"||t.type==="tr") prompt=`<p class="prompt-ru">«${esc(t.ru)}»</p>`;
  else if(t.type==="choose") prompt=`<p class="prompt-en" id="ch-q"></p>`;
  else if(t.type==="fix") prompt=`${t.ctx?`<p class="muted small">${esc(t.ctx)}</p>`:""}<p class="prompt-en"><span class="wrong">${esc(t.wrong)}</span></p>`;
  else if(t.type==="react") prompt=`<p class="muted small">Собеседник говорит:</p><p class="prompt-en">«${esc(t.say)}»</p><p class="about">${esc(t.about)}</p>`;
  else if(t.type==="focus") prompt=`<p class="prompt-en">${esc(t.s).replace(/\{(.+?)\}/,"<mark>$1</mark>")}</p>${t.about?`<p class="about">${esc(t.about)}</p>`:""}`;
  else if(t.type==="answer") prompt=`<p class="muted small">Тебе ответили:</p><p class="prompt-en">«${esc(t.reply)}»</p><p class="about">${esc(t.about)}</p>`;
  card.innerHTML=`<div class="task-type"><span class="eyebrow">${t.label||TYPE_LABEL[t.type]}</span><span class="muted small">+10 XP с первой попытки</span></div>
    <div>${prompt}</div><div id="ia"></div><div id="fb" aria-live="polite"></div><div class="actions" id="act"></div>`;
  card.classList.remove("shake");
  renderIA(); renderFB(); renderAct(); updateStrip();
  const inp=$("#ans"); if(inp){ inp.focus(); if(t.type==="fix") inp.setSelectionRange(inp.value.length,inp.value.length); }
}
function renderIA(){
  const t=T.t, ia=$("#ia");
  if(t.type==="choose"){
    const q=$("#ch-q"); if(q) q.innerHTML=esc(t.q).replace("___",`<span class="blank">${T.done?esc(t.opts[t.ans]):"&nbsp;"}</span>`);
    ia.innerHTML=`<div class="opts">${T.order.map((j,pos)=>{ const o=t.opts[j]; return `<button class="opt ${T.wrongOpts.includes(j)?"wrong":""} ${T.done&&j===t.ans?"right":""}" data-act="opt" data-o="${j}" ${T.done||T.wrongOpts.includes(j)?"disabled":""}><kbd>${pos+1}</kbd>${esc(o)}</button>`; }).join("")}</div>`;
  } else if(t.type==="build"){
    ia.innerHTML=`<div class="chip-zone ${T.picked.length?"filled":""}" id="zone">${T.picked.length?T.picked.map((ci,k)=>`<button class="chip" data-act="unchip" data-k="${k}" ${T.done?"disabled":""}>${esc(T.chips[ci])}</button>`).join(""):`<span class="zone-ph">Нажимай на слова ниже по порядку</span>`}</div>
      <div class="chip-bank" style="margin-top:12px">${T.chips.map((w,ci)=>`<button class="chip ${T.picked.includes(ci)?"ghost":""}" data-act="chip" data-c="${ci}" ${T.done||T.picked.includes(ci)?"disabled":""}>${esc(w)}</button>`).join("")}</div>`;
  } else {
    if(!$("#ans")) ia.innerHTML=`<input class="inp" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t.type==="fix"?"Исправь":t.type==="react"?"Напиши реакцию по-английски":"Напиши вопрос по-английски"}" value="${t.type==="fix"?esc(t.wrong):""}">`;
    $("#ans").disabled=T.done;
  }
}
function formulaHint(t){
  return `<div class="formula">${parseF(t.f).map((s,i)=>{ const hide=s.tag==="a"||s.tag==="v";
    const txt=hide?"?":(i===0?cap(s.text):s.text); return slot(s.tag,esc(txt),SEG_LABEL[s.tag]).replace('class="tok','class="tok'+(hide?" mask":"")); }).join("")}<span class="plus">${t.end||"?"}</span></div>`;

function ruleLink(cat){
  const id=(CONTENT[T.t.mid].catSec||CAT_SEC)[cat]||"formula", sec=CONTENT[T.t.mid].rules().find(s=>s.id===id);
  return sec ? `<button class="linkbtn small" data-act="rule" data-sec="${id}">Правило: ${esc(sec.title)} →</button>` : "";
}
function renderFB(){
  const t=T.t, fb=$("#fb");
  if(T.done){
    const main=mainText(t);
    const head = T.result==="first" ? "Верно!" : T.result==="hint" ? "Верно, с подсказкой" : "Правильный ответ";
    const notes=[];
    if(T.typo) notes.push(`Засчитано, но есть опечатка: <b>${esc(T.typo.from)}</b> → <b>${esc(T.typo.to)}</b>.`);
    if(T.alt) notes.push("Твой вариант тоже правильный. Основной вариант:");

      ${notes.map(n=>`<p class="small">${n}</p>`).join("")}
      <div class="ans-line">${tokensHTML(t)}${sayBtn(main)}</div>
      <p class="muted small">${esc(t.ru)}</p>
      ${T.result!=="first"?ruleLink(T.cat):""}
      ${t.alt&&t.alt.length?`<div class="alts"><div class="eyebrow">${t.end?"Можно ответить иначе":"Можно спросить иначе"}</div>${t.alt.map(([en,lab])=>`<div class="alt">${sayBtn(en)}<span class="en">${esc(en)}</span><span class="pill">${esc(lab)}</span></div>`).join("")}</div>`:""}
    </div>`;
    return;
  }
  let h="";
  if(T.msg) h+=`<div class="fb warn"><div class="fb-head">${T.attempts?"Пока не так":"Подсказка"}</div><p>${esc(T.msg)}</p>
    ${T.stage>=2&&t.type!=="choose"?`<p class="small muted">Формула ответа:</p>${formulaHint(t)}${T.msg!==t.hint?`<p class="small">${esc(t.hint)}</p>`:""}`:""}
    ${ruleLink(T.cat)}</div>`;
  fb.innerHTML=h;
}
function renderAct(){
  const t=T.t, a=$("#act");
  if(T.done){ const last=S.sess.i>=S.sess.ids.length-1; a.innerHTML=`<button class="btn primary" data-act="next" id="next-btn">${last?"Результаты →":"Дальше →"}</button>`; $("#next-btn").focus(); return; }
  const hintLabel = t.type==="choose" ? "Подсказка" : T.stage===0 ? "Подсказка" : T.stage===1 ? "Ещё подсказка" : "Показать ответ";
  a.innerHTML=`${t.type!=="choose"?`<button class="btn primary" data-act="check">Проверить</button>`:""}
    ${t.type==="build"?`<button class="btn" data-act="reset-chips">Сбросить</button>`:""}
    <span class="spacer"></span><button class="btn ghost" data-act="hint">${hintLabel}</button>`;
}
function shake(){ const c=$("#card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
function check(){
  if(T.done) return next();
  const t=T.t;
  const raw = t.type==="build" ? T.picked.map(i=>T.chips[i]).join(" ") : ($("#ans")||{}).value||"";
  if(!norm(raw)){ T.msg=t.type==="build"?"Сначала собери вопрос из слов.":"Сначала напиши вопрос."; renderFB(); return; }
  if(t.type==="fix" && norm(raw)===norm(t.wrong)){ T.msg="Это исходный вариант с ошибкой. Найди, что в нём не так, и исправь."; renderFB(); shake(); return; }
  const m=match(t,raw);
  if(m.ok){ T.typo=m.typo||null; T.alt=!!m.alt; finish(T.attempts===0&&!T.hinted?"first":"hint"); return; }
  T.attempts++;
  const d=diagnose(t,raw);
  if(!T.firstCat) T.firstCat=d.cat;
  T.cat=d.cat;
  T.stage=Math.max(T.stage,Math.min(T.attempts,3));
  T.msg=d.msg;
  if(T.stage>=3){ finish("shown"); return; }
  renderFB(); renderAct(); shake();
}
function hint(){
  if(T.done) return;
  const t=T.t; T.hinted=true;
  if(t.type==="choose"){ T.msg=t.hint; renderFB(); return; }
  if(T.stage>=2){ finish("shown"); return; }
  T.stage++; if(T.stage===1||!T.msg) T.msg=t.hint;
  renderFB(); renderAct();
}
function pickOpt(i){
  const t=T.t; if(T.done||T.wrongOpts.includes(i)||t.type!=="choose") return;
  if(i===t.ans){ finish(T.attempts===0&&!T.hinted?"first":"hint"); return; }
  T.attempts++; T.wrongOpts.push(i);
  if(!T.firstCat) T.firstCat=t.cat||"other";
  T.cat=t.cat||"other";
  T.msg=(t.why&&t.why[i])||t.hint;
  if(T.attempts>=2){ finish("shown"); return; }
  renderIA(); renderFB(); shake();
}
function finish(r){
  T.done=true; T.result=r;
  const s=S.sess; s.res[T.t.id]=r;
  if(T.firstCat && r!=="first") s.cats[T.firstCat]=(s.cats[T.firstCat]||0)+1;
  const gain=r==="first"?10:r==="hint"?5:0; s.xp+=gain; S.xp+=gain; touchDay();
  const bm=T.t.mid, bank=S.bank[bm]||(S.bank[bm]=[]);
  if(r==="first"){ if(s.mode==="mistakes"){ const k=bank.indexOf(T.t.id); if(k>=0) bank.splice(k,1); } }
  else if(!bank.includes(T.t.id)) bank.push(T.t.id);
  save(); if(r!=="shown") beep();
  renderIA(); renderFB(); renderAct(); updateStrip(); updateTop();
}
function next(){
  const s=S.sess; s.i++;
  if(s.i>=s.ids.length){
    const first=Object.values(s.res).filter(x=>x==="first").length;
    if(s.mode==="full"){ const st=modState(s.mid); st.best=Math.max(st.best||0,first); st.runs++; }
    if(s.mode==="exam") S.examBest=Math.max(S.examBest||0,first);
    S.last={...s, first}; S.sess=null; save(); go("results"); return;
  }
  save(); mountTask(); window.scrollTo({top:0,behavior:"smooth"});
}
function viewResults(){
  const r=S.last; if(!r) return viewMap();
  if(r.mode==="exam") return viewExamResults(r);
  const m={t:modTitle(r.mid)}, n=r.ids.length, vals=Object.values(r.res);

  const cats=Object.entries(r.cats).sort((a,b)=>b[1]-a[1]); const max=cats.length?cats[0][1]:1;
  const bank=(S.bank[r.mid]||[]).length, pass=r.mode==="full"&&first>=Math.ceil(n*.8);
  return `<section class="lesson-sec"><div class="eyebrow">${r.mode==="mistakes"?"Работа над ошибками":"Результат"} · ${esc(m.t)}</div>
    <h1>${first===n?"Идеально!":pass?"Модуль пройден":"Хорошая работа"}</h1>
    <p class="muted">${r.mode==="full"?(pass?"80% с первой попытки — следующий модуль можно начинать.":"Чтобы модуль засчитался, нужно 80% с первой попытки (40 из 50)."):"Задания, решённые с первой попытки, убраны из банка ошибок."}</p></section>
  <section class="card"><div class="score">
    <div><span class="muted small">С первой попытки</span><b style="color:var(--ok)">${first} / ${n}</b></div>
    <div><span class="muted small">С подсказкой</span><b style="color:var(--warn)">${hinted}</b></div>
    <div><span class="muted small">Показан ответ</span><b style="color:var(--bad)">${shown}</b></div>
    <div><span class="muted small">Получено</span><b>${r.xp} XP</b></div></div></section>
  ${cats.length?`<section class="card lesson-sec"><h2>Где ошибался</h2>
    ${cats.map(([c,k])=>`<div class="catrow"><span>${CAT_LABEL[c]||c}</span><div class="bar"><i style="width:${k/max*100}%"></i></div><span>${k}</span></div>`).join("")}
    <div class="fb warn"><div class="fb-head">Совет</div><p>${esc((CONTENT[r.mid].tips||{})[cats[0][0]]||CAT_TIP[cats[0][0]]||CAT_TIP.other)}</p></div></section>`:""}
  <div class="row">${bank?`<button class="btn primary" data-act="train" data-id="${r.mid}" data-mode="mistakes">Повторить ошибки (${bank})</button>`:""}
    <button class="btn ${bank?"":"primary"}" data-act="train" data-id="${r.mid}" data-mode="full">Пройти заново</button>
    <button class="btn" data-act="lesson" data-id="${r.mid}">Пройти урок ещё раз</button>
    <button class="btn ghost" data-act="home">На карту</button></div>`;
}

/* ---- exam results ---- */
function viewExamResults(r){
  const n=r.ids.length, vals=Object.values(r.res), first=vals.filter(x=>x==="first").length;
  const rows=MODULES.map((m,i)=>{ const ids=r.ids.filter(id=>TASKS[id]&&TASKS[id].mid===m.id); const ok=ids.filter(id=>r.res[id]==="first").length; return {m,i,total:ids.length,ok}; }).filter(x=>x.total);
  const weak=rows.filter(x=>x.ok<x.total).sort((a,b)=>a.ok/a.total-b.ok/b.total).slice(0,4);
  const pass=first>=40;
  return `<section class="lesson-sec"><div class="eyebrow">Итоговый экзамен · результат</div>
    <h1>${first===n?"Идеально!":pass?"Экзамен сдан":"Почти получилось"}</h1>
    <p class="muted">${pass?"40 и больше с первой попытки — ты уверенно задаёшь вопросы всех типов.":"Чтобы сдать экзамен, нужно 40 из 50 с первой попытки. Ниже — какие темы стоит повторить."}</p></section>
  <section class="card"><div class="score">
    <div><span class="muted small">С первой попытки</span><b style="color:var(--ok)">${first} / ${n}</b></div>
    <div><span class="muted small">Лучший результат</span><b>${S.examBest||first} / 50</b></div>
    <div><span class="muted small">Получено</span><b>${r.xp} XP</b></div></div></section>
  <section class="card lesson-sec"><h2>По модулям</h2>
    ${rows.map(x=>`<div class="catrow"><span>${x.i+1}. ${esc(x.m.t)}</span><div class="bar"><i style="width:${x.ok/x.total*100}%;background:${x.ok===x.total?"var(--ok)":"var(--warn)"}"></i></div><span>${x.ok}/${x.total}</span></div>`).join("")}</section>
  ${weak.length?`<section class="card lesson-sec"><h2>Что повторить</h2><div class="row">${weak.map(x=>`<button class="btn" data-act="lesson" data-id="${x.m.id}">Урок ${x.i+1}: ${esc(x.m.t)}</button>`).join("")}</div></section>`:""}
  <div class="row"><button class="btn primary" data-act="train" data-id="exam" data-mode="exam">Сдать ещё раз</button><button class="btn ghost" data-act="home">На карту</button></div>`;
}

/* ---- placement test ---- */
let PL=null;
function startPlacement(){
  PL={i:0,answers:[],picked:null,qs:MODULES.filter(m=>CONTENT[m.id]).map(m=>({mid:m.id,q:CONTENT[m.id].check[2]}))};
  PL.qs.forEach(x=>x.ord=shuffle(x.q.opts.map((_,j)=>j)));
  go("placement");
}
function plPick(j){
  if(!PL||PL.picked!=null||PL.i>=PL.qs.length) return;
  const cur=PL.qs[PL.i]; PL.picked=j; PL.answers[PL.i]=(j===cur.q.ans);
  if(PL.answers[PL.i]) beep();
  render();
}
function plNext(){
  if(!PL||PL.picked==null) return;
  PL.i++; PL.picked=null;
  if(PL.i>=PL.qs.length){
    const wrong=PL.qs.findIndex((x,k)=>!PL.answers[k]);
    const start=wrong===-1?"exam":PL.qs[wrong].mid;
    PL.qs.forEach((x,k)=>{ modState(x.mid).placed = (wrong===-1||k<wrong); });
    S.placement={start,score:PL.answers.filter(Boolean).length,answers:PL.answers.slice()}; touchDay(); save();
  }
  render(); window.scrollTo(0,0);
}
function viewPlacement(){
  if(!PL) return viewMap();
  const total=PL.qs.length;
  if(PL.i>=total){
    const st=S.placement, sIdx=MODULES.findIndex(x=>x.id===st.start);
    return `<section class="lesson-sec"><div class="eyebrow">Вводный тест · результат</div>
      <h1>${st.start==="exam"?"Ты знаешь все темы":"Начни с модуля "+(sIdx+1)}</h1>
      <p class="muted">${st.start==="exam"?"Все 16 ответов верные. Проверь себя на итоговом экзамене — там задания сложнее.":`Правильно: ${st.score} из ${total}. Модули до ${sIdx+1}-го ты уже знаешь — они отмечены на карте. Начни с «${esc(modTitle(st.start))}». Ошибки в следующих модулях разберёшь по ходу.`}</p></section>
    <section class="card lesson-sec"><h2>Ответы по модулям</h2>
      ${PL.qs.map((x,k)=>`<div class="catrow"><span>${MODULES.findIndex(m=>m.id===x.mid)+1}. ${esc(modTitle(x.mid))}</span><span class="pill ${PL.answers[k]?"ok":"warn"}" style="justify-self:start">${PL.answers[k]?"верно":"стоит пройти"}</span><span></span></div>`).join("")}</section>
    <div class="row">${st.start==="exam"?`<button class="btn primary" data-act="train" data-id="exam" data-mode="exam">Начать экзамен</button>`:`<button class="btn primary" data-act="lesson" data-id="${st.start}">Открыть урок ${sIdx+1}</button>`}<button class="btn ghost" data-act="home">На карту</button></div>`;
  }
  const cur=PL.qs[PL.i], q=cur.q, n=MODULES.findIndex(m=>m.id===cur.mid)+1, done=PL.picked!=null;
  const blank=q.q.includes("___")?esc(q.q).replace("___",`<span class="blank">${done?esc(q.opts[q.ans]):"&nbsp;"}</span>`):esc(q.q);
  return `<section class="train-head"><div class="row"><div><div class="eyebrow">Вводный тест · модуль ${n}</div><h2 style="margin-top:2px">${esc(modTitle(cur.mid))}</h2></div><span class="spacer"></span><span class="pill acc">${PL.i+1} / ${total}</span></div>
    <div class="strip" aria-hidden="true">${PL.qs.map((_,k)=>`<i class="${k<PL.i?(PL.answers[k]?"f":"s"):k===PL.i?"cur":""}"></i>`).join("")}</div></section>
  <section class="card task"><div class="task-type"><span class="eyebrow">Выбери правильный вариант</span><span class="muted small">Без подсказок — отвечай, как знаешь</span></div>
    <p class="prompt-en">${blank}</p>
    <div class="opts">${cur.ord.map((j,pos)=>`<button class="opt ${done&&j===q.ans?"right":""} ${done&&j===PL.picked&&j!==q.ans?"wrong":""}" data-act="pl" data-o="${j}" ${done?"disabled":""}><kbd>${pos+1}</kbd>${esc(q.opts[j])}</button>`).join("")}</div>
    ${done?`<div class="fb ${PL.answers[PL.i]?"ok":"warn"}"><div class="fb-head">${PL.answers[PL.i]?"Верно!":"Не совсем"}</div><p class="small">${esc(q.hint)}</p></div>
    <div class="actions"><button class="btn primary" data-act="pl-next" id="pl-next">${PL.i===total-1?"Результат →":"Дальше →"}</button></div>`:""}
  </section>
  <p class="kbd-hint">Клавиши 1–3 — выбрать ответ, Enter — дальше.</p>`;
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const dr=$("#drawer"); if(e.target===dr){ closeRule(); return; }
  const b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  const act=b.dataset.act;
  if(["home","lesson","train"].includes(act)) closeRule();
  if(act==="home") go("map");
  else if(act==="lesson") go("lesson",b.dataset.id);
  else if(act==="lesson-restart") go("lesson",ARG);
  else if(act==="train") startTrain(b.dataset.id,b.dataset.mode||"full");
  else if(act==="rule") openRule(b.dataset.sec);
  else if(act==="close-rule") closeRule();
  else if(act==="toc"){ const scope=b.closest(".drawer-panel")||document; const el=scope.querySelector(`section[data-sec="${b.dataset.sec}"]`); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"}); }
  else if(act==="sound"){ S.sound=!S.sound; save(); updateTop(); }
  else if(act==="say") say(b.dataset.say);
  else if(act==="demo-tab"){ DEMO={i:+b.dataset.i,k:0}; drawDemo(false); }
  else if(act==="demo-next"){ const n=curDemos()[DEMO.i].frames.length; if(DEMO.k<n-1){ DEMO.k++; drawDemo(true); } else { DEMO.k=0; drawDemo(false); } }
  else if(act==="demo-prev"){ if(DEMO.k>0){ DEMO.k--; drawDemo(true); } }
  else if(act==="mc") mcPick(+b.dataset.q,+b.dataset.o);
  else if(act==="opt") pickOpt(+b.dataset.o);
  else if(act==="chip"){ T.picked.push(+b.dataset.c); T.msg=T.attempts?T.msg:null; renderIA(); }
  else if(act==="unchip"){ T.picked.splice(+b.dataset.k,1); renderIA(); }
  else if(act==="reset-chips"){ T.picked=[]; renderIA(); }
  else if(act==="check") check();
  else if(act==="hint") hint();
  else if(act==="next") next();
  else if(act==="placement") startPlacement();
  else if(act==="pl") plPick(+b.dataset.o);
  else if(act==="pl-next") plNext();
});
document.addEventListener("keydown",e=>{
  if(!$("#drawer").hidden){ if(e.key==="Escape") closeRule(); return; }
  if(VIEW==="placement" && PL && PL.i<PL.qs.length){ const cur=PL.qs[PL.i];
    if(e.key==="Enter" && PL.picked!=null){ e.preventDefault(); plNext(); }
    else if(/^[1-4]$/.test(e.key) && PL.picked==null && cur.ord[+e.key-1]!=null) plPick(cur.ord[+e.key-1]);
    return; }
  if(VIEW!=="train"||!T) return;
  if(e.key==="Enter"){ e.preventDefault(); if(T.done) next(); else if(T.t.type!=="choose") check(); return; }
  if(T.t.type==="choose" && !T.done && /^[1-4]$/.test(e.key)){ const i=+e.key-1; if(i<T.order.length) pickOpt(T.order[i]); }
  if(T.t.type==="build" && !T.done && e.key==="Backspace" && T.picked.length){ e.preventDefault(); T.picked.pop(); renderIA(); }
});

function tipsHTML(list){ return `<div class="tips">${list.map(([k,h,p,exs])=>`<div class="tip tip-${k}"><span class="pill">${{mem:"Запоминалка",obs:"Наблюдение",hack:"Лайфхак"}[k]}</span><h3>${h}</h3><p>${p}</p>${(exs||[]).map(e=>`<div>${ex(e)}</div>`).join("")}</div>`).join("")}</div>`; }
function errsHTML(list){ return `<div class="errs">${list.map(([n,y,w])=>`<div class="err"><span class="no">${esc(n)}</span><span class="yes">${esc(y)}</span><span class="why">${esc(w)}</span></div>`).join("")}</div>`; }
const strike = s => `<span class="mono" style="color:var(--bad);text-decoration:line-through">${esc(s)}</span>`;
const mn = s => `<span class="mono">${s}</span>`;
function boot(){
  for (const mid in CONTENT){ const C=CONTENT[mid]; C.id=mid;
    (C.tasks||[]).forEach((t,i)=>{ t.id=mid+"-"+(i+1); t.mid=mid; TASKS[t.id]=t; });
    for (const k in (C.cats||{})){ CAT_LABEL[k]=C.cats[k][0]; CAT_TIP[k]=C.cats[k][1]; } }
  render();
}
document.addEventListener("DOMContentLoaded", boot);
